# Deploys AMA OS's Supabase side when its files change:
#  1. table changes (supabase/migrations) applied as the ama_os_app login only
#  2. edge functions (supabase/functions/amaos-*) deployed to the shared AMA Supabase project
# Secrets are added in GitHub by AMA owners; they never appear in this repository.
name: Supabase (AMA OS)
on:
  push:
    branches: [main, amaos]
    paths: ['supabase/**', 'scripts/migrate.sh', '.github/workflows/supabase.yml']
  workflow_dispatch:
concurrency: { group: supabase-ama-os, cancel-in-progress: false }
env:
  SUPABASE_PROJECT_REF: ptdrcxngaptcgswfbjhg
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ vars.SUPABASE_DB_HOST || 'aws-0-ap-southeast-2.pooler.supabase.com' }}
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: ama_os_app.ptdrcxngaptcgswfbjhg
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: |
          if [ -z "$PGPASSWORD" ]; then echo "SUPABASE_DB_PASSWORD not added yet - skipping"; exit 0; fi
          ./scripts/migrate.sh
  functions:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.20.5 }
      - name: Deploy AMA OS functions only (never the Toolkit's)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN not added yet - skipping"; exit 0; fi
          for d in supabase/functions/amaos-*/; do
            n=$(basename "$d"); echo "deploy $n"
            flags=""; case "$n" in amaos-sync|amaos-oath|amaos-photos|amaos-conn) flags="--no-verify-jwt";; esac   # called by the hub with its sync key, not a sign-in
            supabase functions deploy "$n" --project-ref "$SUPABASE_PROJECT_REF" --use-api $flags
          done

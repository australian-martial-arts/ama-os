# Read-only check of what the AMA OS database login can use (extensions, timers). Prints no secrets.
name: AMA OS db check
on:
  workflow_dispatch:
    inputs:
      test: { description: 'Also fire one timer call (efcnext/dash)', required: false, default: '' }
      timers: { description: 'pause or start the AMA OS database timers', required: false, default: '' }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ vars.SUPABASE_DB_HOST || 'aws-0-ap-southeast-2.pooler.supabase.com' }}
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: ama_os_app.ptdrcxngaptcgswfbjhg
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: |
          psql -c "select name, installed_version, default_version from pg_available_extensions where name in ('pg_cron','pg_net','http','supabase_vault')"
          psql -c "select current_user, rolsuper, rolcreaterole from pg_roles where rolname = current_user"
          psql -c "select has_schema_privilege('cron','usage') cron_usage" || true
          psql -c "select has_schema_privilege('net','usage') net_usage, has_function_privilege('net.http_post(text,jsonb,jsonb,jsonb,integer)','execute') net_post" || true
          psql -c "select jobid, schedule, jobname, username, active from cron.job" || true
          if [ "${{ github.event.inputs.timers }}" = "pause" ]; then psql -c "select cron.unschedule(jobname) from cron.job where jobname like 'amaos-%'"; fi
          if [ "${{ github.event.inputs.timers }}" = "start" ]; then psql -c "select ama_os.start_timers()"; fi
          if [ -n "${{ github.event.inputs.test }}" ]; then
            psql -c "select name, set_at from ama_os.connections where name in ('GHL_TOKEN') "
            R=$(psql -tA -c "select ama_os.refresh_call('${{ github.event.inputs.test }}')"); echo "request $R"
            for i in $(seq 1 20); do sleep 3; N=$(psql -tA -c "select count(*) from net._http_response where id = $R"); [ "$N" = "1" ] && break; done
            psql -c "select status_code, left(content::text, 200) as body, left(coalesce(error_msg,''),100) err, created from net._http_response where id = $R" || true
            sleep 40
            psql -c "select key, at, data from ama_os.cache where key = 'timer_beat'"
          fi
          echo "== AMA OS vs hub trials (same event id, different number or status) =="
          psql -c "with a as (select case when x->>'id' like 'W%' then 'W:'||(x->>'who')||(x->>'day') else x->>'id' end id, x->>'num' num, x->>'status' st, x->>'who' who, x->>'day' dy from ama_os.cache c, jsonb_array_elements(c.data->'trials') x where c.key='trials_live'),
            h as (select coalesce(m.data->>'id', 'W:'||(m.data->>'who')||(m.data->>'day')) id, m.data->>'num' num, m.data->>'status' st from ama_os.mirror m where m.source='GHL trials')
            select a.dy, a.who, a.id, a.num os_num, h.num hub_num, a.st os_status, h.st hub_status from a full join h using (id)
            where a.num is distinct from h.num or a.st is distinct from h.st order by 1" || true
          psql -c "select (select count(*) from ama_os.mirror where source='GHL trials') hub_trials, (select jsonb_array_length(data->'trials') from ama_os.cache where key='trials_live') os_trials, (select max(at) from ama_os.mirror_runs where source='GHL trials') hub_sent" || true
          psql -c "select data, at from ama_os.cache where key = 'absent_counts'" || true
          psql -c "select source, count(*) from ama_os.mirror where source in ('Later starts','Absentees','New members') group by 1" || true
          echo "== Database timers: last beat and recent calls =="
          psql -c "select key, at, case when key in ('dash_m','trials_live') then coalesce(data->'needs', to_jsonb(jsonb_array_length(data->'trials'))) else data end from ama_os.cache where key in ('timer_beat','trials_live','absent_counts','dash_m') order by key" -P format=wrapped | cut -c1-160 || true
          psql -c "select status_code, count(*), max(created) from net._http_response where created > now() - interval '30 minutes' group by 1" || true
          echo "== Timer detail =="
          psql -c "select id, status_code, left(coalesce(error_msg,''),120) err, left(content::text,140) body, created from net._http_response where created > now() - interval '40 minutes' and (content::text like '%\"ok\"%' or error_msg is not null) order by created desc limit 15" || true
          psql -c "select jobid, status, left(return_message,140) msg, start_time from cron.job_run_details where jobid in (select jobid from cron.job where jobname like 'amaos-%') order by start_time desc limit 10" || true
          echo "== Web-call results by hour (all jobs) =="
          psql -c "select date_trunc('hour', created) + floor(extract(minute from created)/10)*interval '10 min' h, count(*) filter (where status_code is not null) ok, count(*) filter (where error_msg like 'Timeout%') timeouts from net._http_response where created > now() - interval '2 hours' group by 1 order by 1" || true

# Fails any push that contains a live key or token (GHL, Anthropic, Stripe, Google, GitHub, Supabase) or the old hub secret.
# Keys belong in Script Properties / Supabase secrets / GitHub secrets, never in this public repository.
name: Secret scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          P='pit-[0-9a-f]{8}-|sk-ant-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_|sk_live_[A-Za-z0-9]{10,}|rk_live_[A-Za-z0-9]{10,}|sbp_[a-f0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY'
          HITS=$(git grep -nIE "$P" -- . ':!.github/workflows/secret-scan.yml' || true)
          if [ -n "$HITS" ]; then echo "$HITS" | sed -E 's/(pit-|sk-ant-|AIza|ghp_|sk_live_|rk_live_|sbp_)[A-Za-z0-9_-]+/\1<hidden>/g' | cut -c1-160
            echo "::error::A key or token is in the code. Remove it, revoke it, and keep it in Script Properties or secrets instead."; exit 1; fi
          echo "No keys found."

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1713">
  <meta name="robots" content="noindex">
  <title>AMA OS</title>
  <style>
    :root { --bg:#0f1713; --panel:#16201b; --line:#273530; --ink:#eef4f0; --ink-2:#aebcb4; --ink-3:#6f8178; --accent:#f5c518; --ok:#7fd6a2; --err:#ff8a7a; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Barlow", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .badge { display: inline-block; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #1a120d; background: var(--accent); border-radius: 999px; padding: 6px 14px; }
    h1 { font-size: clamp(34px, 9vw, 48px); font-weight: 800; margin: 20px 0 8px; letter-spacing: -.01em; }
    p { color: var(--ink-2); margin: 0 auto 18px; max-width: 34ch; }
    form { display: grid; gap: 10px; text-align: left; }
    label { font-size: 13px; color: var(--ink-3); }
    input { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: #1a120d; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .link { background: none; color: var(--ink-2); font-weight: 500; padding: 6px; text-decoration: underline; }
    .msg { min-height: 22px; font-size: 14px; margin-top: 6px; }
    .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
    .who { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; }
    .who b { display: block; font-size: 18px; } .who span { color: var(--ink-3); font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">AMA</span>
    <h1>AMA OS</h1>

    <section id="stepEmail">
      <p>Staff sign-in, with the same mobile and PIN as the hub and the Toolkit.</p>
      <form id="emailForm">
        <label for="email">Your mobile number</label>
        <input id="email" type="tel" inputmode="tel" autocomplete="username" required placeholder="04xx xxx xxx">
        <label for="pin">Your hub PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="PIN">
        <button id="sendBtn" type="submit">Sign in</button>
      </form>
    </section>

    <section id="stepCode" hidden>
      <p>We've texted you a sign-in code. It can take a minute to arrive.</p>
      <form id="codeForm">
        <label for="code">Sign-in code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code">
        <button id="codeBtn" type="submit">Sign in</button>
        <button class="link" type="button" id="backBtn">Use a different number</button>
      </form>
    </section>

    <section id="stepMfa" hidden>
      <p id="mfaIntro">Owners and admins confirm it's them with a second step.</p>
      <div style="display:grid;gap:10px;margin-bottom:14px">
        <button type="button" id="pkUseBtn" hidden>Use Face ID / fingerprint (passkey)</button>
        <button type="button" class="link" id="totpShowBtn" hidden>Use my authenticator app instead</button>
      </div>
      <div id="mfaQr" style="background:#fff;border-radius:12px;padding:12px;margin:0 auto 12px;width:fit-content" hidden></div>
      <p id="mfaSecret" style="font-size:13px;word-break:break-all" hidden></p>
      <form id="mfaForm" hidden>
        <label for="mfaCode">6-digit code from your authenticator app</label>
        <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456">
        <button id="mfaBtn" type="submit">Confirm</button>
      </form>
    </section>

    <section id="stepIn" hidden>
      <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
      <p style="margin-top:16px">You're in. AMA OS is being built here; your hub pages will appear as they move across.</p>
      <button type="button" id="pkAddBtn" hidden>Add a passkey on this device (Face ID / fingerprint)</button>
      <button class="link" type="button" id="outBtn">Sign out</button>
    </section>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@10.0.0/dist/bundle/index.umd.min.js"></script>
  <script>
  (function () {
    var C = window.AMAOS_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
    var ROLE = { owner: 'Owner', full: 'Full-access admin', marketing: 'Marketing', admin: 'Admin', junior: 'Junior admin', instructor: 'Instructor' };
    function msg(t, kind) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
    function show(id) { ['stepEmail', 'stepCode', 'stepMfa', 'stepIn'].forEach(function (s) { $(s).hidden = s !== id; }); }
    if (!C.supabaseAnonKey || /PASTE/.test(C.supabaseAnonKey)) { msg('Sign-in is being connected. Check back shortly.', 'err'); $('sendBtn').disabled = true; return; }
    var sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: true, detectSessionInUrl: true } });
    var email = '', justSignedIn = false, mfaFactor = null, mfaChallenge = null, idleTimer = null;
    var IDLE_MIN = 30; // shared front-desk computers: sign out after 30 minutes with no activity
    function idle() { clearTimeout(idleTimer); idleTimer = setTimeout(function () { setStep(''); sb.auth.signOut().then(function () { show('stepEmail'); msg('Signed out after ' + IDLE_MIN + ' minutes of no activity.'); }); }, IDLE_MIN * 60000); }
    ['click', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) { document.addEventListener(ev, function () { if (!$('stepIn').hidden) idle(); }, { passive: true }); });
    function getStep() { try { return sessionStorage.getItem('amaosStepup') || ''; } catch (e) { return ''; } }
    function setStep(t) { try { if (t) sessionStorage.setItem('amaosStepup', t); else sessionStorage.removeItem('amaosStepup'); } catch (e) {} }
    function pk(act, extra) {
      return sb.auth.getSession().then(function (r) {
        var s = r.data && r.data.session; var hdr = { Authorization: 'Bearer ' + (s ? s.access_token : ''), apikey: C.supabaseAnonKey, 'content-type': 'application/json' };
        var su = getStep(); if (su) hdr['x-amaos-stepup'] = su;
        return fetch(C.supabaseUrl + '/functions/v1/amaos-passkey', { method: 'POST', headers: hdr, body: JSON.stringify(Object.assign({ act: act }, extra || {})) }).then(function (x) { return x.json(); });
      });
    }
    var canPk = !!(window.SimpleWebAuthnBrowser && SimpleWebAuthnBrowser.browserSupportsWebAuthn());
    function startMfa(passkeys) {
      show('stepMfa');
      $('pkUseBtn').hidden = !(canPk && passkeys > 0);
      if (canPk && passkeys > 0) { $('mfaIntro').textContent = "Confirm it's you with Face ID, fingerprint or your device PIN."; $('mfaForm').hidden = true; $('totpShowBtn').hidden = false; $('mfaQr').hidden = true; $('mfaSecret').hidden = true; return Promise.resolve(); }
      $('totpShowBtn').hidden = true; return startTotp();
    }
    function startTotp() {
      $('mfaForm').hidden = false; $('pkUseBtn').hidden = true; $('totpShowBtn').hidden = true;
      return sb.auth.mfa.listFactors().then(function (r) {
        var f = (r.data && r.data.totp || []).filter(function (x) { return x.status === 'verified'; })[0];
        show('stepMfa'); $('mfaCode').value = '';
        if (f) { mfaFactor = f.id; $('mfaIntro').textContent = 'Enter the 6-digit code from your authenticator app.'; $('mfaQr').hidden = true; $('mfaSecret').hidden = true; return; }
        return sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'AMA OS ' + new Date().toISOString().slice(0, 10) }).then(function (e) {
          if (e.error) { msg('Could not set up the authenticator. Please try again.', 'err'); return; }
          mfaFactor = e.data.id;
          $('mfaIntro').textContent = 'One-time set-up: scan this with Google Authenticator or Microsoft Authenticator, then enter the 6-digit code it shows.';
          $('mfaQr').innerHTML = e.data.totp.qr_code.indexOf('<svg') === 0 ? e.data.totp.qr_code : '<img alt="Authenticator QR code" width="180" height="180" src="' + e.data.totp.qr_code + '">'; $('mfaQr').hidden = false;
          $('mfaSecret').textContent = 'Can\'t scan? Enter this key: ' + e.data.totp.secret; $('mfaSecret').hidden = false;
        });
      });
    }
    function toPhone(v) { var d = String(v).replace(/\D/g, ''); if (/^04\d{8}$/.test(d)) return '+61' + d.slice(1); if (/^614\d{8}$/.test(d)) return '+' + d; return ''; }

    function whoAmI() {
      return sb.auth.getSession().then(function (r) {
        var s = r.data && r.data.session; if (!s) { show('stepEmail'); return; }
        var hdr = { Authorization: 'Bearer ' + s.access_token, apikey: C.supabaseAnonKey }; var su = getStep(); if (su) hdr['x-amaos-stepup'] = su; if (justSignedIn) { hdr['x-amaos-event'] = 'signin'; justSignedIn = false; }
        return fetch(C.supabaseUrl + '/functions/v1/amaos-me', { method: 'POST', headers: hdr })
          .then(function (res) { return res.json(); })
          .then(function (j) {
            if (!j.ok && j.mfa) { msg(''); return startMfa(j.passkeys || 0); }
            if (!j.ok) { msg(j.error || 'Not allowed.', 'err'); sb.auth.signOut(); show('stepEmail'); return; }
            idle(); $('pkAddBtn').hidden = true; if (j.secondStep && window.SimpleWebAuthnBrowser && SimpleWebAuthnBrowser.browserSupportsWebAuthn()) pk('status').then(function (p) { $('pkAddBtn').hidden = !(p.ok && p.count === 0); });
            $('whoName').textContent = j.name; $('whoRole').textContent = (ROLE[j.role] || j.role); show('stepIn'); msg('');
          });
      }).catch(function () { msg('Could not reach AMA OS. Please try again.', 'err'); });
    }

    $('emailForm').onsubmit = function (e) {
      e.preventDefault(); email = toPhone($('email').value);
      if (!email) { msg('Enter your Australian mobile, e.g. 0412 345 678.', 'err'); return; }
      var pin = $('pin').value.trim(); if (!pin) { msg('Enter your PIN.', 'err'); return; }
      $('sendBtn').disabled = true; msg('Signing in…');
      // One login for AMA OS and the Toolkit: the Toolkit's "hub" function checks the mobile + PIN
      // against the hub (lockouts and Active status included) and returns a Supabase session.
      fetch(C.supabaseUrl + '/functions/v1/hub', { method: 'POST', headers: { 'content-type': 'application/json', apikey: C.supabaseAnonKey },
        body: JSON.stringify({ mobile: $('email').value.replace(/\D/g, ''), pin: pin }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          $('pin').value = '';
          if (!j || !j.ok || !j.session) { $('sendBtn').disabled = false; msg((j && j.error) || "That mobile and PIN didn't match.", 'err'); return; }
          return sb.auth.setSession({ access_token: j.session.access_token, refresh_token: j.session.refresh_token }).then(function (r) {
            $('sendBtn').disabled = false;
            if (r.error) { msg('Signed in, but the session could not start. Please try again.', 'err'); return; }
            justSignedIn = true; whoAmI();
          });
        })
        .catch(function () { $('sendBtn').disabled = false; $('pin').value = ''; msg('Could not reach the sign-in service. Please try again.', 'err'); });
    };
    $('codeForm').onsubmit = function (e) {
      e.preventDefault(); $('codeBtn').disabled = true; msg('Checking…');
      sb.auth.verifyOtp({ phone: email, token: $('code').value.trim(), type: 'sms' }).then(function (r) {
        $('codeBtn').disabled = false;
        if (r.error) { msg("That code didn't work. Check it, or request a new one.", 'err'); return; }
        whoAmI();
      });
    };
    $('mfaForm').onsubmit = function (e) {
      e.preventDefault(); $('mfaBtn').disabled = true; msg('Checking…');
      sb.auth.mfa.challengeAndVerify({ factorId: mfaFactor, code: $('mfaCode').value.trim() }).then(function (r) {
        $('mfaBtn').disabled = false;
        if (r.error) { msg("That code didn't work. Check the time on your phone is set automatically, then try again.", 'err'); return; }
        justSignedIn = true; whoAmI();
      });
    };
    $('totpShowBtn').onclick = function () { startTotp(); };
    $('pkUseBtn').onclick = function () {
      $('pkUseBtn').disabled = true; msg('Waiting for your passkey…');
      pk('login-options').then(function (o) {
        if (!o.ok) throw new Error(o.error);
        return SimpleWebAuthnBrowser.startAuthentication(o.options);
      }).then(function (resp) { return pk('login-verify', { response: resp }); })
        .then(function (v) { $('pkUseBtn').disabled = false; if (!v.ok) throw new Error(v.error); setStep(v.stepup); justSignedIn = true; whoAmI(); })
        .catch(function (e) { $('pkUseBtn').disabled = false; msg((e && e.message && !/NotAllowed|abort/i.test(e.name || '')) ? e.message : 'Passkey cancelled. Try again, or use your authenticator app.', 'err'); });
    };
    $('pkAddBtn').onclick = function () {
      $('pkAddBtn').disabled = true; msg('Follow the prompt on your device…');
      pk('reg-options').then(function (o) {
        if (!o.ok) throw new Error(o.error);
        return SimpleWebAuthnBrowser.startRegistration(o.options);
      }).then(function (resp) { return pk('reg-verify', { response: resp, label: navigator.platform || 'device' }); })
        .then(function (v) { $('pkAddBtn').disabled = false; if (!v.ok) throw new Error(v.error); $('pkAddBtn').hidden = true; msg('Passkey added. Next time, confirm with Face ID or your fingerprint.', 'ok'); })
        .catch(function (e) { $('pkAddBtn').disabled = false; msg((e && e.message && !/NotAllowed|abort/i.test(e.name || '')) ? e.message : 'Passkey set-up cancelled.', 'err'); });
    };
    $('backBtn').onclick = function () { show('stepEmail'); msg(''); };
    $('outBtn').onclick = function () { setStep(''); sb.auth.signOut().then(function () { show('stepEmail'); msg('Signed out.'); }); };

    whoAmI();
  })();
  </script>
</body>
</html>

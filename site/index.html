<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1713">
  <meta name="robots" content="noindex">
  <title>AMA OS</title>
  <style>
    :root { --bg:#0f1713; --panel:#16201b; --line:#273530; --ink:#eef4f0; --ink-2:#aebcb4; --ink-3:#6f8178; --accent:#f5c518; --ok:#7fd6a2; --err:#ff8a7a; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Barlow", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .badge { display: inline-block; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #1a120d; background: var(--accent); border-radius: 999px; padding: 6px 14px; }
    h1 { font-size: clamp(34px, 9vw, 48px); font-weight: 800; margin: 20px 0 8px; letter-spacing: -.01em; }
    p { color: var(--ink-2); margin: 0 auto 18px; max-width: 34ch; }
    form { display: grid; gap: 10px; text-align: left; }
    label { font-size: 13px; color: var(--ink-3); }
    input { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: #1a120d; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .link { background: none; color: var(--ink-2); font-weight: 500; padding: 6px; text-decoration: underline; }
    .msg { min-height: 22px; font-size: 14px; margin-top: 6px; }
    .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
    .who { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; }
    .who b { display: block; font-size: 18px; } .who span { color: var(--ink-3); font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">AMA</span>
    <h1>AMA OS</h1>

    <section id="stepEmail">
      <p>Staff sign-in. Coming soon for the whole team.</p>
      <form id="emailForm">
        <label for="email">Your AMA email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@australianmartialarts.com.au">
        <button id="sendBtn" type="submit">Email me a sign-in code</button>
      </form>
    </section>

    <section id="stepCode" hidden>
      <p>We've emailed you a sign-in code. It can take a minute to arrive.</p>
      <form id="codeForm">
        <label for="code">Sign-in code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code">
        <button id="codeBtn" type="submit">Sign in</button>
        <button class="link" type="button" id="backBtn">Use a different email</button>
      </form>
    </section>

    <section id="stepIn" hidden>
      <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
      <p style="margin-top:16px">You're in. AMA OS is being built here; your hub pages will appear as they move across.</p>
      <button class="link" type="button" id="outBtn">Sign out</button>
    </section>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
  (function () {
    var C = window.AMAOS_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
    var ROLE = { owner: 'Owner', full: 'Full-access admin', marketing: 'Marketing', admin: 'Admin', junior: 'Junior admin', instructor: 'Instructor' };
    function msg(t, kind) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
    function show(id) { ['stepEmail', 'stepCode', 'stepIn'].forEach(function (s) { $(s).hidden = s !== id; }); }
    if (!C.supabaseAnonKey || /PASTE/.test(C.supabaseAnonKey)) { msg('Sign-in is being connected. Check back shortly.', 'err'); $('sendBtn').disabled = true; return; }
    var sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: true, detectSessionInUrl: true } });
    var email = '';

    function whoAmI() {
      return sb.auth.getSession().then(function (r) {
        var s = r.data && r.data.session; if (!s) { show('stepEmail'); return; }
        return fetch(C.supabaseUrl + '/functions/v1/amaos-me', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token, apikey: C.supabaseAnonKey } })
          .then(function (res) { return res.json(); })
          .then(function (j) {
            if (!j.ok) { msg(j.error || 'Not allowed.', 'err'); sb.auth.signOut(); show('stepEmail'); return; }
            $('whoName').textContent = j.name; $('whoRole').textContent = (ROLE[j.role] || j.role) + ' · ' + j.email; show('stepIn'); msg('');
          });
      }).catch(function () { msg('Could not reach AMA OS. Please try again.', 'err'); });
    }

    $('emailForm').onsubmit = function (e) {
      e.preventDefault(); email = $('email').value.trim().toLowerCase(); $('sendBtn').disabled = true; msg('Sending…');
      sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } })
        .then(function (r) {
          $('sendBtn').disabled = false;
          if (r.error) { msg("We couldn't send a code to that email. Use the email you sign in to the Toolkit with.", 'err'); return; }
          show('stepCode'); msg('Code sent to ' + email + '.', 'ok'); $('code').focus();
        });
    };
    $('codeForm').onsubmit = function (e) {
      e.preventDefault(); $('codeBtn').disabled = true; msg('Checking…');
      sb.auth.verifyOtp({ email: email, token: $('code').value.trim(), type: 'email' }).then(function (r) {
        $('codeBtn').disabled = false;
        if (r.error) { msg("That code didn't work. Check it, or request a new one.", 'err'); return; }
        whoAmI();
      });
    };
    $('backBtn').onclick = function () { show('stepEmail'); msg(''); };
    $('outBtn').onclick = function () { sb.auth.signOut().then(function () { show('stepEmail'); msg('Signed out.'); }); };
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN') whoAmI(); });
    whoAmI();
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1713">
  <title>AMA OS</title>
  <style>
    :root { --bg:#0f1713; --panel:#16201b; --line:#273530; --ink:#eef4f0; --ink-2:#aebcb4; --ink-3:#6f8178; --accent:#f5c518; --ok:#7fd6a2;
      color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 "Barlow", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    .card { width: 100%; max-width: 460px; text-align: center; }
    .badge { display: inline-block; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12px;
      color: #1a120d; background: var(--accent); border-radius: 999px; padding: 6px 14px; }
    h1 { font-size: clamp(34px, 9vw, 52px); font-weight: 800; margin: 22px 0 10px; letter-spacing: -.01em; }
    p { color: var(--ink-2); margin: 0 auto; max-width: 36ch; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--ok); margin-right: 7px; vertical-align: middle; }
    .status { margin-top: 24px; display: inline-flex; align-items: center; font-size: 14px; color: var(--ink-3);
      background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">AMA</span>
    <h1>AMA OS</h1>
    <p>The staff hub is being set up here. Nothing to see yet — this page just confirms the site is live.</p>
    <div class="status"><span class="dot"></span>Deployed and connected</div>
  </main>
</body>
</html>
